# pour test avant vidéo
name: Terraform CI/CD

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      action:
        description: "Action Terraform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: "Environnement cible"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "eu-west-3"

jobs:
  # ==========================================
  # JOB 1 : PLAN AUTO SUR PULL REQUEST
  # ==========================================
  terraform-plan-pr:
    name: "Plan PR → ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # Plan sur les 3 envs en parallèle à chaque PR
    strategy:
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -no-color

  # ==========================================
  # JOB 2 : APPLY MANUEL
  # ==========================================
  terraform-apply:
    name: "Apply → ${{ github.event.inputs.environment }}"
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'apply'

    environment:
      name: ${{ github.event.inputs.environment }}   # protection par env GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/${{ github.event.inputs.environment }}
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

  # ==========================================
  # JOB 3 : DESTROY MANUEL
  # ⚠️  SANS REMOTE STATE → NE DÉTRUIRA RIEN
  # ==========================================
  terraform-destroy:
    name: "Destroy → ${{ github.event.inputs.environment }}"
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: environments/${{ github.event.inputs.environment }}
        run: |
          terraform destroy -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

